# Cấu hình chung cho bot

symbol: "BTCUSDT"
timeframe: "15m"           # khung giờ biến động nhanh -> dùng cho trend_reversal

data:
  source: "binance"          # nguồn dữ liệu, tuỳ bạn implement trong data/fetch.py
  lookback_bars: 500         # số nến lịch sử tải mỗi lần

# Mỗi entry: alias tự đặt -> {func: tên hàm trong features/registry.py, ...tham số}
# Alias PHẢI trùng tên field tương ứng trong decision/base.py::MarketState
# để decision engine đọc được (xem backtest/engine.py).
features:
  indicators:
    ema_fast:
      func: ema
      period: 9
    ema_mid:
      func: ema
      period: 21
    ema_slow:
      func: ema
      period: 50
    rsi_fast:
      func: rsi
      period: 9

decision:
  engine: "trend_reversal"   # trend_reversal | ml_classifier | rl_agent

risk:
  log_path: "logs/reversals.log"   # nơi ghi log mỗi khi có điểm đảo chiều

backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  initial_capital: 10000   # chưa dùng tới ở giai đoạn hiện tại (chưa có size/PnL)
