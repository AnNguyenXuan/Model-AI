# Cấu hình chung cho bot

symbol: "BTCUSDT"
timeframe: "1h"

data:
  source: "binance"          # nguồn dữ liệu, tuỳ bạn implement trong data/fetch.py
  lookback_bars: 500         # số nến lịch sử tải mỗi lần

features:
  indicators: ["ema_20", "ema_50", "rsi_14", "atr_14"]

decision:
  engine: "rule_based"       # rule_based | ml_classifier | rl_agent (thêm dần theo roadmap)

risk:
  risk_per_trade_pct: 1.0    # % vốn rủi ro mỗi lệnh
  atr_multiplier_sl: 2.0     # stop-loss = entry - ATR * multiplier
  max_drawdown_pct: 20.0     # dừng bot nếu drawdown tổng vượt ngưỡng này

execution:
  mode: "log_only"           # log_only | live (live chưa implement)
  log_path: "logs/orders.log"

backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  initial_capital: 10000
